{% extends 'components/base.html' %}
{% block title %}Edit Post{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h3 class="text-2xl font-bold text-gray-900 mb-6 leading-tight">Edit Post</h3>
        
        <form method="post" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label for="content" class="block text-sm font-medium text-gray-700 mb-1">
                    Content
                </label>
                <textarea 
                    id="content"
                    name="content" 
                    rows="5" 
                    class="w-full px-3 py-2 bg-white border border-gray-200 rounded-lg text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all resize-y" 
                    required>{{ post.content }}</textarea>
            </div>

            <div class="flex items-center gap-3 pt-2">
                <button 
                    type="submit" 
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-sm rounded-lg shadow-sm transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1 cursor-pointer">
                    Save Changes
                </button>
                <a 
                    href="{% url 'home' %}" 
                    class="px-4 py-2 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 font-medium text-sm rounded-lg transition-colors duration-150 inline-block">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
