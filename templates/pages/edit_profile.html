{% extends 'components/base.html' %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h3 class="text-2xl font-bold text-gray-900 mb-6 leading-tight">Edit Profile</h3>
        
        <form method="post" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}
            
            <!-- Bio Field -->
            <div>
                <label for="bio" class="block text-sm font-medium text-gray-700 mb-1">
                    Bio
                </label>
                <textarea 
                    id="bio"
                    name="bio" 
                    rows="3" 
                    class="w-full px-3 py-2 bg-white border border-gray-200 rounded-lg text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all resize-y">{{ user.bio }}</textarea>
            </div>

            <!-- Location Field -->
            <div>
                <label for="location" class="block text-sm font-medium text-gray-700 mb-1">
                    Location
                </label>
                <input 
                    type="text" 
                    id="location"
                    name="location" 
                    value="{{ user.location }}" 
                    class="w-full px-3 py-2 bg-white border border-gray-200 rounded-lg text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
            </div>

            <!-- Profile Picture Preview & Upload -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Profile Picture
                </label>
                
                <div class="flex items-center gap-4 mb-3">
                    {% if user.profile_picture %}
                        <img src="{{ user.profile_picture.url }}" alt="{{ user.username }}" class="w-20 h-20 rounded-full object-cover border-2 border-gray-100 shadow-sm shrink-0">
                    {% else %}
                        <div class="w-20 h-20 rounded-full bg-blue-600 flex items-center justify-center text-white text-xl font-bold border-2 border-gray-100 shadow-sm shrink-0">
                            {{ user.username.0|upper }}
                        </div>
                    {% endif %}

                    <div class="flex-1 min-w-0">
                        <input 
                            type="file" 
                            id="profile_picture"
                            name="profile_picture" 
                            class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-colors cursor-pointer">
                        <p class="text-xs text-gray-400 mt-1">PNG, JPG, or GIF up to 5MB.</p>
                    </div>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="flex items-center gap-3 pt-3 border-t border-gray-100">
                <button 
                    type="submit" 
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-sm rounded-lg shadow-sm transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1 cursor-pointer">
                    Save Changes
                </button>
                <a 
                    href="{% url 'profile' request.user.username %}" 
                    class="px-4 py-2 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 font-medium text-sm rounded-lg transition-colors duration-150 inline-block">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
